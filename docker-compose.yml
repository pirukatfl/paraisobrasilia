# Local development database.
# Rodar localmente: cp .env.example .env && docker compose up -d db && pnpm dev
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: paraiso
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paraiso_dev}
      POSTGRES_DB: paraiso
    ports:
      # loopback only: never expose Postgres on the network
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U paraiso -d paraiso']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
